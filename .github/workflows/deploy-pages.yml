# Builds the frontend and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment half-way; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # RULES.md §5.20: fail the deploy if a production dependency has a known vulnerability.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # The site is served from the root of its custom domain (ppsolarenergy.in), so the
      # base path is fixed to "/". Do not derive it from configure-pages: a build made
      # before the domain was attached got "/pp-solar-info/" and rendered a blank page.
      # To serve it at <user>.github.io/<repo>/ instead, set the repository variable
      # SITE_BASE_PATH to "/<repo>/".
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.SITE_BASE_PATH || '/' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
